name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Ekstrak file .zip di repo (kalau ada), jadi tidak perlu diekstrak manual
      - name: Ekstrak zip
        shell: bash
        run: |
          shopt -s nullglob
          for z in *.zip; do unzip -oq "$z" -d _src; done

      # Cari folder proyek otomatis
      - name: Cari folder proyek
        id: proj
        shell: bash
        run: |
          f=$(find . -maxdepth 4 -name settings.gradle.kts | head -n 1)
          if [ -z "$f" ]; then
            echo "settings.gradle.kts tidak ditemukan. Isi repo:"
            find . -maxdepth 3 -not -path './.git/*' | head -60
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Ringkasan error
        if: failure()
        shell: bash
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          {
            echo '### Error build'
            echo '```'
            grep -E -A6 '^e: |What went wrong|FAILURE' build.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Simpan log build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ steps.proj.outputs.dir }}/build.log
          if-no-files-found: ignore

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: StokGudang-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
